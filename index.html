<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3e6">
<title>Diwaloween</title>
<style>
:root{
  --cream:#fff3e6; --orange:#ff9f1c; --deep-orange:#f2711c; --pink:#ff5fa2; --soft-pink:#ffb3d1;
  --purple:#5b2a86; --lilac:#b57edc; --yellow:#ffd23f;
  --f:ui-rounded,"SF Pro Rounded","Avenir Next Rounded","Nunito","Quicksand","Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:var(--f); color:var(--purple);
  background:
    radial-gradient(circle at 12% 8%, rgba(255,159,28,.38), transparent 45%),
    radial-gradient(circle at 92% 22%, rgba(255,95,162,.30), transparent 45%),
    radial-gradient(circle at 50% 105%, rgba(181,126,220,.38), transparent 55%),
    var(--cream);
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  -webkit-user-select:none; user-select:none;
}
.screen{position:fixed;inset:0}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:10;pointer-events:none}

/* ---------- Screen 1 ---------- */
#s1{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh;
  padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);cursor:pointer;
  transition:opacity .9s ease;z-index:2}
#s1.gone{opacity:0;pointer-events:none}
.txt{position:relative;z-index:1;margin:0;text-align:center;font-weight:600;letter-spacing:-.01em;line-height:1.25;
  font-size:clamp(1.35rem,6vw,1.9rem);max-width:14em;transition:opacity .4s}
#s1.casting .txt{opacity:0}
#dusk{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .7s ease;
  background:linear-gradient(170deg,#4a1f78 0%,#9b2f8a 55%,#e0528a 100%)}
#s1.casting #dusk{opacity:.93}
.wandwrap{position:relative;z-index:3;height:min(30vh,250px);aspect-ratio:100/300;
  transform-origin:50% 88%;animation:float 3.4s ease-in-out infinite}
.wandwrap svg{width:100%;height:100%;overflow:visible;transform:rotate(12deg)}
.wandwrap.swish{animation:swish .85s cubic-bezier(.45,0,.3,1) forwards}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes swish{
  0%{transform:rotate(0) translateY(0);opacity:1;animation-timing-function:ease-out}
  20%{transform:rotate(-48deg) translateY(3px);opacity:1;animation-timing-function:cubic-bezier(.4,0,.5,1)}
  75%{opacity:1}
  100%{transform:rotate(120deg) translateY(-24px) scale(.4);opacity:0}}
@keyframes tw{0%,100%{transform:scale(.3);opacity:.25}50%{transform:scale(1);opacity:1}}

/* ---------- Screen 2 ---------- */
#s2{z-index:3;overflow-y:auto;-webkit-overflow-scrolling:touch;opacity:0;visibility:hidden;
  transition:opacity .9s ease,visibility 0s .9s}
#s2.show{opacity:1;visibility:visible;transition:opacity .9s ease,visibility 0s}
.page{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:calc(20vh + env(safe-area-inset-top)) 22px calc(20vh + env(safe-area-inset-bottom))}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
h1{position:relative;margin:0;font-size:clamp(2.1rem,10vw,3.5rem);line-height:1.1;font-weight:700;letter-spacing:-.02em;color:var(--purple)}
.thanks{position:relative;margin:12px 0 28px;font-size:clamp(.95rem,4vw,1.15rem);font-weight:500;color:var(--purple);opacity:.85}
.logos{position:relative;display:flex;gap:12px;width:100%;max-width:420px;justify-content:center;align-items:stretch}
.logo{flex:1 1 0;min-height:72px;display:flex;align-items:center;justify-content:center;padding:10px 12px;
  border-radius:20px;background:rgba(255,255,255,.75);border:1.5px solid var(--soft-pink);
  color:var(--purple);text-decoration:none;font-weight:600;line-height:1.2;font-size:clamp(.9rem,3.8vw,1.1rem);
  box-shadow:0 6px 16px rgba(255,95,162,.16);-webkit-user-select:none;user-select:none}
.logo:active{transform:scale(.97)}
.logo:focus-visible,.again:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.logo img{display:block;max-width:100%;max-height:64px;object-fit:contain}
.again{position:relative;margin-top:30px;min-height:52px;padding:12px 28px;border:0;border-radius:999px;
  font:600 clamp(1rem,4.2vw,1.15rem) var(--f);color:#fff;cursor:pointer;
  background:linear-gradient(100deg,var(--pink),var(--deep-orange));box-shadow:0 5px 0 #c8397f,0 10px 20px rgba(255,95,162,.3)}
.again:active{transform:translateY(3px);box-shadow:0 2px 0 #c8397f}

.fl,.fl2{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.fl2{animation-duration:1.1s}
.gl{animation:glow 1.8s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(0)}25%{transform:scale(.94,1.12) rotate(-2.5deg)}
  50%{transform:scale(1.05,.93) rotate(2deg)}75%{transform:scale(.97,1.08) rotate(-1deg)}}
@keyframes glow{50%{opacity:.6}}

@media (prefers-reduced-motion:reduce){
  .wandwrap,.tw,.fl,.fl2,.gl{animation:none!important}
  .wandwrap.swish{opacity:0;transition:opacity .5s}
  #s1,#s2,#dusk{transition-duration:.01s!important}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="gGlow"><stop offset="0" stop-color="#ffe27a" stop-opacity=".85"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ffd23f"/></linearGradient>
  <linearGradient id="gBowl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2711c"/><stop offset="1" stop-color="#d6336c"/></linearGradient>
  <radialGradient id="gPump" cx=".4" cy=".35"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a1a"/></radialGradient>
  <linearGradient id="gWand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5fa2"/><stop offset="1" stop-color="#7a35b5"/></linearGradient>
  <linearGradient id="gStar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#ffa51f"/></linearGradient>
  <radialGradient id="gStarGlow"><stop offset="0" stop-color="#ffe27a" stop-opacity=".7"/><stop offset="1" stop-color="#ff9f1c" stop-opacity="0"/></radialGradient>
</defs></svg>

<!-- Screen 1: the spell -->
<main id="s1" class="screen" aria-label="Tap to cast a spell">
  <p class="txt">Psst... want to cast a spell?</p>
  <div id="dusk"></div>
  <div class="wandwrap" id="wand">
    <svg viewBox="0 0 100 300" aria-hidden="true">
      <path d="M46.5 50L53.5 50L52 290L48 290Z" fill="url(#gWand)"/>
      <g stroke="#ffd23f" stroke-width="2.4" stroke-linecap="round">
        <path d="M46.9 97L53.1 90"/><path d="M46.8 127L53.2 120"/><path d="M46.8 157L53.2 150"/>
        <path d="M46.7 187L53.3 180"/><path d="M46.6 217L53.4 210"/><path d="M46.5 247L53.5 240"/>
      </g>
      <rect x="44.5" y="262" width="11" height="9" rx="3" fill="#ffd23f"/>
      <circle cx="50" cy="291" r="5.5" fill="#ffd23f"/>
      <circle cx="50" cy="40" r="40" fill="url(#gStarGlow)"/>
      <path d="M50 14L56.76 30.7L74.73 31.97L60.94 43.55L65.28 61.03L50 51.5L34.72 61.03L39.06 43.55L25.27 31.97L43.24 30.7Z"
        fill="url(#gStar)" stroke="#ffb703" stroke-width="5" stroke-linejoin="round"/>
      <path d="M50 24L53.4 33L62.5 33.6L55.5 39.5L57.7 48.3L50 43.5L42.3 48.3L44.5 39.5L37.5 33.6L46.6 33Z" fill="#fff8d6" opacity=".9"/>
      <circle id="tipcore" cx="50" cy="40" r="3" fill="none"/>
      <g fill="#ff5fa2"><g transform="translate(18 16)"><path class="tw" d="M0-8Q1.2-1.2 8 0Q1.2 1.2 0 8Q-1.2 1.2-8 0Q-1.2-1.2 0-8Z"/></g></g>
      <g fill="#ffd23f"><g transform="translate(84 20)"><path class="tw" style="animation-delay:-.6s" d="M0-8Q1.2-1.2 8 0Q1.2 1.2 0 8Q-1.2 1.2-8 0Q-1.2-1.2 0-8Z"/></g>
        <g transform="translate(12 62)"><path class="tw" style="animation-delay:-1.2s" d="M0-6Q1-1 6 0Q1 1 0 6Q-1 1-6 0Q-1-1 0-6Z"/></g></g>
      <g fill="#b57edc"><g transform="translate(90 66)"><path class="tw" style="animation-delay:-.3s" d="M0-6Q1-1 6 0Q1 1 0 6Q-1 1-6 0Q-1-1 0-6Z"/></g>
        <g transform="translate(50 -6)"><path class="tw" style="animation-delay:-.9s" d="M0-6Q1-1 6 0Q1 1 0 6Q-1 1-6 0Q-1-1 0-6Z"/></g></g>
    </svg>
  </div>
</main>

<!-- Screen 2: Happy Diwaloween -->
<section id="s2" class="screen" aria-label="Happy Diwaloween">
  <div class="page">
    <div class="deco" id="deco"></div>
    <h1><img src="title.png" alt="Happy Diwaloween" style="display:block;width:min(88vw,420px);height:auto"></h1>
    <p class="thanks">Thank you for celebrating with us today!</p>
    <div class="logos">
      <!-- To use a logo image: replace the <span> with <img src="calico.png" alt="Calico Global School"> -->
      <a class="logo" href="https://www.instagram.com/calicoglobal.school/" target="_blank" rel="noopener noreferrer"><span>Calico Global School</span></a>
      <!-- To use a logo image: replace the <span> with <img src="garden-of-growth.png" alt="Garden of Growth Daycare"> -->
      <a class="logo" href="https://www.instagram.com/gardenofgrowthdaycare/" target="_blank" rel="noopener noreferrer"><span>Garden of Growth Daycare</span></a>
    </div>
    <button class="again" id="again" type="button">Cast another spell ✨</button>
  </div>
</section>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var cv=$("#fx"),ctx=cv.getContext("2d"),s1=$("#s1"),s2=$("#s2"),wand=$("#wand"),core=$("#tipcore");
var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var W=1,H=1,dpr=1;
function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener("resize",size);size();

var rnd=function(a,b){return a+Math.random()*(b-a)};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
var TAU=Math.PI*2,MAXP=650;
var BRIGHT=["#ffd23f","#ff9f1c","#ff5fa2","#ffb3d1","#fff3b0","#d9a5ff"];
var DUST=["#ffb703","#ff9f1c","#ff5fa2","#d98cff"];
var GOLD=["#ffd23f","#ffe27a","#ffb703","#fff3b0"];
var HEART=["#ffb3d1","#ff9ccb","#ffc9de","#ffa8cf"];

var ps=[],sp=[],locked=false,onS1=true,swishing=false,lastFx=-1,tip={x:W/2,y:H/3},acc0=0,prev=0;

function add(o){if(ps.length>=MAXP)return;o.age=0;o.ph=Math.random()*TAU;o.rot=o.rot||0;o.vr=o.vr||0;o.g=o.g||0;o.drag=o.drag||0;ps.push(o)}
function tipPos(){var r=core.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}}
function env(p){return Math.max(0,Math.min(1,p.age/.2)*Math.min(1,(p.life-p.age)/.5))}

function starPath(r){ctx.beginPath();
  for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r,x=Math.cos(a)*rr,y=Math.sin(a)*rr;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
  ctx.closePath()}
function heartPath(){ctx.beginPath();ctx.moveTo(0,10);
  ctx.bezierCurveTo(-26,-8,-17,-28,0,-13);ctx.bezierCurveTo(17,-28,26,-8,0,10);ctx.closePath()}

function draw(p){
  var a=Math.max(0,1-p.age/p.life);
  ctx.save();
  ctx.globalCompositeOperation=p.add?"lighter":"source-over";
  ctx.fillStyle=p.c;ctx.strokeStyle=p.c;
  if(p.t==="spark"){
    ctx.globalAlpha=a;ctx.lineWidth=p.s;ctx.lineCap="round";ctx.beginPath();
    ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.04,p.y-p.vy*.04);ctx.stroke();
  }else if(p.t==="dot"){
    ctx.globalAlpha=a;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.1,p.s*(.4+.6*a)),0,TAU);ctx.fill();
  }else if(p.t==="star"){
    ctx.globalAlpha=env(p)*(.65+.35*Math.sin(p.age*14+p.ph));
    ctx.translate(p.x,p.y);ctx.rotate(p.rot);starPath(p.s);ctx.fill();
  }else if(p.t==="shoot"){
    var x2=p.x-p.vx*.13,y2=p.y-p.vy*.13,gr=ctx.createLinearGradient(p.x,p.y,x2,y2);
    gr.addColorStop(0,p.c);gr.addColorStop(1,"rgba(255,210,63,0)");
    ctx.globalAlpha=env(p);ctx.strokeStyle=gr;ctx.lineWidth=p.s*.55;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.translate(p.x,p.y);ctx.rotate(p.age*6);starPath(p.s);ctx.fill();
  }else if(p.t==="heart"){
    var k=p.s*(1+.14*Math.sin(p.age*9+p.ph))/30,e=env(p);
    ctx.translate(p.x,p.y);ctx.scale(k,k);
    ctx.globalAlpha=e*.28;ctx.scale(1.4,1.4);heartPath();ctx.fill();ctx.scale(1/1.4,1/1.4);
    ctx.globalAlpha=e*.92;heartPath();ctx.fill();
    ctx.globalAlpha=e*.6;ctx.fillStyle="#ffffff";ctx.beginPath();ctx.arc(-9,-10,3,0,TAU);ctx.fill();
  }else if(p.t==="lantern"){
    var le=env(p),lf=.85+.15*Math.sin(p.age*9+p.ph),lr=p.s;
    ctx.translate(p.x,p.y);
    var lg=ctx.createRadialGradient(0,0,0,0,0,lr*3.2);
    lg.addColorStop(0,p.c);lg.addColorStop(1,"rgba(255,170,60,0)");
    ctx.globalAlpha=le*.55*lf;ctx.fillStyle=lg;ctx.beginPath();ctx.arc(0,0,lr*3.2,0,TAU);ctx.fill();
    ctx.globalAlpha=le*.95;ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(0,0,lr*.8,lr,0,0,TAU);ctx.fill();
    ctx.globalAlpha=le*.9*lf;ctx.fillStyle="#fff6c9";ctx.beginPath();ctx.ellipse(0,lr*.15,lr*.35,lr*.55,0,0,TAU);ctx.fill();
}
  ctx.restore();
}

function frame(now){
  window.requestAnimationFrame(frame);
  try{
    var dt=Math.min(.05,Math.max(.001,(now-prev)/1000||.016));prev=now;
    ctx.clearRect(0,0,W,H);
    var i,s,p,d;
    for(i=sp.length-1;i>=0;i--){s=sp[i];s.t+=dt;
      if(s.t<0)continue;if(s.t>s.dur){sp.splice(i,1);continue}s.fn(dt,s.t)}
    if(!reduce){
      if(onS1&&(!locked||swishing)){
        tip=tipPos();acc0+=dt;
        var step=swishing?.016:.05;
        while(acc0>step){acc0-=step;
          if(swishing){
            add({t:Math.random()<.4?"star":"dot",x:tip.x+rnd(-4,4),y:tip.y+rnd(-4,4),vx:rnd(-30,30),vy:rnd(-20,50),g:30,
              life:rnd(.5,.9),s:rnd(2,5),rot:rnd(0,TAU),vr:rnd(-3,3),c:pick(BRIGHT)});
          }else{
            add({t:"dot",x:tip.x+rnd(-14,14),y:tip.y+rnd(-14,14),vx:rnd(-12,12),vy:rnd(-40,-8),life:rnd(.7,1.3),s:rnd(1.4,2.6),c:pick(DUST)});
          }}
      }else acc0=0;
    }
    for(i=ps.length-1;i>=0;i--){p=ps[i];p.age+=dt;
      if(p.age>=p.life){ps.splice(i,1);continue}
      p.vy+=p.g*dt;
      if(p.drag){d=Math.pow(p.drag,dt*60);p.vx*=d;p.vy*=d}
      if(p.sway)p.x+=Math.sin(p.age*3+p.ph)*p.sway*dt;
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;draw(p)}
  }catch(err){ps.length=0;sp.length=0}
}

function run(dur,fn){sp.push({t:0,dur:dur,fn:fn})}

/* ---- the four spells ---- */
var DUR=2200;
function stars(){var acc=0;run(DUR,function(dt){acc+=dt;
  while(acc>.05){acc-=.05;
    if(true){var v=rnd(650,950);
      add({t:"shoot",add:true,x:rnd(W*.1,W*1.2),y:-30,vx:-v*.45,vy:v*.9,life:rnd(1,1.4),s:rnd(6,11),c:pick(GOLD.concat(["#ffb3d1","#ffffff"]))})}
    else add({t:"star",add:true,x:rnd(0,W),y:-20,vx:rnd(-30,30),vy:rnd(130,280),life:rnd(1.8,2.6),s:rnd(8,17),rot:rnd(0,TAU),vr:rnd(-2,2),c:pick(BRIGHT)})}})}
function lanterns(){var acc=0,cols=["#ffb703","#ff9f1c","#ff6fae","#ffd23f","#ff8fc0"];
  run(1600,function(dt){acc+=dt;
  while(acc>.045){acc-=.045;var d=Math.random();
    add({t:"lantern",add:true,x:rnd(W*.04,W*.96),y:H*(.4+.65*Math.random()),vx:0,sway:rnd(8,25),vy:-(50+d*110),
      life:rnd(1.7,2.3),s:7+d*12,c:pick(cols)})}})}
function hearts(){var acc=0;run(DUR,function(dt){acc+=dt;
  while(acc>.08){acc-=.08;
    add({t:"heart",x:rnd(W*.06,W*.94),y:rnd(H*.12,H*.92),vx:rnd(-8,8),vy:rnd(-45,-15),life:rnd(1.5,2.3),s:rnd(20,52),c:pick(HEART)})}})}
function boom(x,y){var col=pick(BRIGHT),n=40,sc=Math.min(1.5,W/320),i,a,v;
  add({t:"dot",add:true,x:x,y:y,vx:0,vy:0,life:.25,s:26*sc,c:"#fff3b0"});
  for(i=0;i<n;i++){a=i/n*TAU+rnd(-.05,.05);v=rnd(80,240)*sc*(Math.random()<.3?.6:1);
    add({t:"spark",add:true,x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:110,drag:.965,life:rnd(.9,1.5),s:rnd(2,3.2),c:Math.random()<.2?"#fff3b0":col})}}
function fireworks(){var acc=.3;run(DUR,function(dt){acc+=dt;
  while(acc>.34){acc-=.34;boom(rnd(W*.15,W*.85),rnd(H*.12,H*.58))}})}
var EFFECTS=[stars,lanterns,hearts,fireworks];

/* ---- flow: tap -> swish -> wand vanishes -> spell -> reveal ---- */
function swish(){wand.classList.add("swish");swishing=true;setTimeout(function(){swishing=false},800)}
var FORCE=location.search.slice(1).toLowerCase();
var NAMES={stars:0,lanterns:1,hearts:2,fireworks:3};
function effect(){var k;
  if(NAMES.hasOwnProperty(FORCE)){k=NAMES[FORCE]}
  else{do{k=Math.floor(Math.random()*EFFECTS.length)}while(k===lastFx)}
  lastFx=k;EFFECTS[k]()}
function cast(auto){
  if(locked)return;locked=true;onS1=true;
  ps.length=0;sp.length=0;
  cv.style.transition="none";cv.style.opacity="1";
  s1.classList.add("casting");s1.classList.remove("gone");s2.classList.remove("show");
  var lead=auto?500:0;
  if(reduce){wand.classList.add("swish");setTimeout(reveal,900);return}
  setTimeout(swish,lead);
  setTimeout(effect,lead+800);
  setTimeout(reveal,lead+800+DUR+250);
}
function reveal(){
  s2.scrollTop=0;s2.classList.add("show");s1.classList.add("gone");onS1=false;
  setTimeout(function(){s1.classList.remove("casting");wand.classList.remove("swish");locked=false},1000);
  setTimeout(function(){cv.style.transition="opacity .5s";cv.style.opacity="0"},500);
  setTimeout(function(){ps.length=0;sp.length=0},1000);
}
s1.addEventListener("pointerdown",function(){cast(false)});
$("#again").addEventListener("click",function(){cast(true)});

/* ---- decorations ---- */
var DIYA='<svg viewBox="0 0 100 80"><circle class="gl" cx="50" cy="24" r="26" fill="url(#gGlow)"/>'+
 '<path class="fl" d="M50 40C37 28 45 16 50 3C55 16 63 28 50 40Z" fill="url(#gFlame)"/>'+
 '<path class="fl2" d="M50 38C45 31 48 25 50 19C52 25 55 31 50 38Z" fill="#fff6c9"/>'+
 '<path d="M8 44Q10 75 50 77Q90 75 92 44Z" fill="url(#gBowl)"/><ellipse cx="50" cy="44" rx="42" ry="8" fill="#ffc94d"/>'+
 '<ellipse cx="50" cy="44" rx="35" ry="5" fill="#8a2e4d"/><circle cx="30" cy="62" r="3" fill="#ffd23f"/>'+
 '<circle cx="50" cy="68" r="3" fill="#ffd23f"/><circle cx="70" cy="62" r="3" fill="#ffd23f"/></svg>';
